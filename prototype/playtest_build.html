<script>
/* ============================================================================
   TrueServe — Story/Grind playtest build
   Spec: docs/playtest_build_spec.md · docs/HANDOFF_playtest_build.md
   Numbers mirror sim/encounter_sim.py (the spec's source of truth).
   Scope: front-end + run loop FEEL. Not balance. Tuning here is disposable.
   ========================================================================= */

/* ---------------- CONFIG — every dial lives here ---------------- */
const CFG = {
  K: 1000,                    // damage mitigation constant (LOCKED, playtested)
  TICK_RATE: 0.07,            // momentum gained per SPD per tick (matches combat prototype)
  MOMENTUM_FULL: 100,
  START_MOMENTUM_JITTER: 20,

  /* Player power baseline. Three-way choice, and the reasoning matters:
       'parity' (default) — players use the SAME gear curve as enemies, so an at-level
            dungeon is genuinely even. Needed for the board's verdicts to mean anything.
       'sim'    — encounter_sim.py's player_gear (0.45 -> 0.95). NOTE this starts at 0.45
            while enemy_gear starts at 0, handing players a systematic 1.02x-1.32x edge at
            equal level (widest at low level). That asymmetry is very likely why
            SIM_RESULTS.md reads 100% clears at every tier, and it contradicts
            enemy_profiles_scaling.md section 3 ("a level-1 dungeon must be beatable by a
            NAKED level-1 team") since the sim's level-1 player is not naked.
       'none'   — spec section 2 literal, no gear at all. Players sit ~20% under enemies
            at level; every at-level dungeon reads Brutal.
     The gear ITEM system (slots/substats/drops) is out of scope in all three. */
  PLAYER_GEAR_MODE: 'parity',

  AFFINITY_CRIT_BONUS: 0.15,  // advantage = +15% crit rate ...
  AFFINITY_POT_BONUS: 0.15,   // ... and +15% potency. NOT a flat damage multiplier.
  VARIANCE: [0.95, 1.05],

  SUMMON_PULLS: 30,
  SUMMON_ODDS: { common: 0.60, epic: 0.30, legendary: 0.10 },
  TEAM_SIZE: 4,

  DUNGEON_OFFSETS: [-10, -5, 0, 8, 15],
  FIGHTS_MIN: 3, FIGHTS_MAX: 9,
  BETWEEN_FIGHT_REGEN: 0.15,  // NOT a full heal — attrition is the point
  TINT_CHANCE: 0.60,

  BOSS_HP_PREMIUM: { sprint:3.5, bulwark:1.6, plague:1.6, purist:1.6, siege:1.6 },
  BOSS_AD_PREMIUM: 1.25,

  MENDER_HEAL_PCT: 28, MENDER_TRIGGER: 0.75,
  ENEMY_TANK_THREAT: 2.5,

  SPEEDS: [1, 2, 4], DEFAULT_SPEED: 1,
  BASE_STEP_MS: 260,          // pause between actions at 1x
  MAX_ROUNDS: 60,
};

/* Enemy anchors — player L1 role medians (enemy_profiles_scaling.md section 2) */
const ENEMY_ANCHOR = {
  bruiser:{hp:820, atk:225,def:160,spd:118,label:'Bruiser'},
  warden: {hp:1300,atk:160,def:250,spd:93, label:'Warden'},
  mender: {hp:900, atk:172,def:185,spd:109,label:'Mender'},
  hexer:  {hp:810, atk:200,def:165,spd:118,label:'Hexer'},
  zealot: {hp:800, atk:210,def:170,spd:108,label:'Zealot'},
};
const BOSS_ARCHETYPE = {bruiser:'sprint',warden:'bulwark',mender:'purist',hexer:'plague',zealot:'siege'};
const BOSS_BLURB = {
  sprint:{tag:'SPEED',  hint:'Enrage clock. Race it down before the spiral.'},
  bulwark:{tag:'STRIP', hint:'Self-buffs to a wall. Strip + def-break or you cannot scratch it.'},
  plague:{tag:'CLEANSE',hint:'Stacking debuffs + a bomb. Cleanse, or your team goes inert.'},
  purist:{tag:'BURST',  hint:'Out-heals chip damage. Bring real burst.'},
  siege:{tag:'SURVIVE', hint:'Sustained AoE. Bring heals or shields.'},
};
const AFFINITIES = ['judgment','life','revelation','majesty','mystery'];
const AFF_LABEL = {judgment:'Judgment',life:'Life',revelation:'Revelation',majesty:'Majesty',mystery:'Mystery'};
const SITES = ['Ashfall Reliquary','The Sunken Choir','Embervault Deep','Hollow Sanctum',
  'The Weeping Spire','Cindergate Crypts','Vault of Pale Light','The Riven Cloister'];

/* ---------------- power curves (verbatim from encounter_sim.py) ---------------- */
const lvlMult    = L => 1.0 + 0.5*((L-1)/99);
const playerGear = D => Math.min(0.45 + ((D-1)/100)*0.5, 0.95);
const enemyGear  = D => Math.max(0, Math.min(0.9, (D-1)/100*0.9));
const gearMult   = f => 1.0 + 0.7*f;
const mitigate   = (raw, def) => raw * CFG.K/(CFG.K + Math.max(0,def));
/* Player gear fraction by mode — see CFG.PLAYER_GEAR_MODE for why 'parity' is default. */
function playerGearFrac(L){
  if(CFG.PLAYER_GEAR_MODE === 'sim')    return playerGear(L);
  if(CFG.PLAYER_GEAR_MODE === 'parity') return enemyGear(L);
  return 0;
}
const playerPower = L => lvlMult(L) * gearMult(playerGearFrac(L));

/* ---------------- affinity wheel ---------------- */
const TRIANGLE = {judgment:'life', life:'revelation', revelation:'judgment'};
function hasAdvantage(a, d){
  if(TRIANGLE[a] === d) return true;
  if(a==='majesty' && d==='mystery') return true;
  if(a==='mystery' && d==='majesty') return true;
  return false;                    // off-wheel is never PENALISED vs RGB
}

/* ---------------- rng ---------------- */
let RNG = Math.random;
const rint = n => Math.floor(RNG()*n);
const pick = a => a[rint(a.length)];
const chance = p => RNG() < p;
const vary = () => CFG.VARIANCE[0] + RNG()*(CFG.VARIANCE[1]-CFG.VARIANCE[0]);

/* ============================================================================
   EFFECT ENGINE
   Statuses live on the combatant as {id,mag,dur,stacks}. Stat effects are read
   as multipliers at compute time; nothing mutates baseStats. Effects outside
   IMPLEMENTED still apply as an inert marker and log "not modelled", so gaps
   are visible during play instead of silently doing nothing.
   ========================================================================= */
let EFFECT_META = {};   // id -> {category, stacks, name}

const STAT_UP   = {atk_up:'atk', def_up:'def', spd_up:'spd', pot_up:'pot', res_up:'res',
                   crit_rate_up:'critRate', crit_dmg_up:'critDmg'};
const STAT_DOWN = {atk_down:'atk', def_break:'def', spd_down:'spd', pot_down:'pot',
                   res_down:'res', crit_rate_down:'critRate', momentum_slow_field:'spd'};
const DOTS      = ['poison','bleed','burn','curse'];
const CONTROL_SKIP = ['stun','freeze','sleep'];
const DMG_TAKEN_UP = ['brand','marked','damage_taken_up'];

const IMPLEMENTED = new Set([
  ...Object.keys(STAT_UP), ...Object.keys(STAT_DOWN), ...DOTS, ...CONTROL_SKIP, ...DMG_TAKEN_UP,
  'regen','shield','shield_unbreakable','damage_reduction','dr_unreducible','damage_cap',
  'lifesteal_buff','debuff_immunity','control_immunity','death_immunity','dodge_up','taunt_self',
  'stealth','cannot_miss_buff','momentum_immunity','guaranteed_crit_buff','aura_all_stats',
  'buff_undispellable','permanent_buff_flag','prevent_death_team','team_damage_heals',
  'accuracy_down','anti_heal','healing_block','buff_block','shield_block','dot_amp','wasting',
  'silence','disarm','ult_lock','taunt','provoke_all','threat_mod','reflect','counter',
  'heal','heal_team','revive','cleanse','cleanse_all','strip','strip_multi','dispel_self_debuffs',
  'momentum_push','momentum_pull','momentum_steal','knockback_momentum','extra_action',
  'cooldown_reduction','cooldown_refund','detonate_dot','execute','hp_cost','debuff_bomb',
  'spread_dot','unresistable',
]);
/* debuff_bomb payload — Nyssa's pattern (PROJECT_CONTROL v0.4 note) */
const BOMB_PAYLOAD = [{id:'def_break',mag:30,dur:2},{id:'atk_down',mag:25,dur:2},{id:'res_down',mag:25,dur:2}];

const isBuff = id => (EFFECT_META[id]?.category === 'buff');
const isCleansable = id => {
  const c = EFFECT_META[id]?.category;
  return c==='debuff' || c==='dot' || c==='control' || id==='debuff_bomb' || id==='wasting';
};

/* ============================================================================
   COMBATANT
   ========================================================================= */
let UID = 0;
class Combatant {
  constructor(o){
    Object.assign(this, o);
    this.uid = ++UID;
    this.maxHp = Math.round(o.maxHp);
    this.hp = Math.round(o.hp ?? o.maxHp);
    this.statuses = [];
    this.momentum = RNG()*CFG.START_MOMENTUM_JITTER;
    this.alive = true;
    this.shield = 0;
    this.extraTurn = false;
    this.abilities.forEach(a => a.cd = 0);
  }
  /* --- status helpers --- */
  find(id){ return this.statuses.find(s => s.id===id); }
  has(id){ return !!this.find(id); }
  add(id, mag, dur, forceStack){
    const meta = EFFECT_META[id];
    if(!meta) return false;
    const stackable = meta.stacks || forceStack === true;
    if(isBuff(id) && this.has('buff_block')) return false;
    if(!isBuff(id) && meta.category!=='instant' && this.has('debuff_immunity')) return false;
    if(id==='shield' && this.has('shield_block')) return false;
    if(meta.category==='control' && this.has('control_immunity')) return false;
    const ex = this.find(id);
    if(ex){
      if(stackable){ ex.stacks++; ex.mag = mag ?? ex.mag; ex.dur = Math.max(ex.dur, dur); }
      else if((mag??0) >= (ex.mag??0)){ ex.mag = mag; ex.dur = Math.max(ex.dur, dur); } // refresh-if-stronger
    } else {
      this.statuses.push({id, mag: mag??0, dur: dur??2, stacks:1});
    }
    return true;
  }
  remove(id){ this.statuses = this.statuses.filter(s => s.id!==id); }
  /* --- derived stats --- */
  stat(key){
    let v = this.base[key] ?? 0;
    let up = 0, down = 0;
    for(const s of this.statuses){
      const m = (s.mag||0) * (s.stacks||1) / 100;   // stacks>1 only when authored stacks:true
      if(STAT_UP[s.id]===key)   up   += m;
      if(STAT_DOWN[s.id]===key) down += m;
      if(s.id==='aura_all_stats' && ['atk','def','spd','hp'].includes(key)) up += m;
    }
    if(key==='pot'||key==='res'||key==='critRate'||key==='critDmg') return Math.max(0, v + up - down);
    return Math.max(1, v * (1 + up - down));
  }
  get atk(){ return this.stat('atk'); }
  get def(){ return this.stat('def'); }
  get spd(){ return this.stat('spd'); }
  get pot(){ return this.stat('pot'); }
  get res(){ return this.stat('res'); }
  get critRate(){ return this.stat('critRate'); }
  get critDmg(){ return this.stat('critDmg'); }
  get skipsTurn(){ return CONTROL_SKIP.some(c => this.has(c)); }
  canUse(i){
    if(i===0 && this.has('disarm')) return false;
    if(i===1 && this.has('silence')) return false;
    if(i===2 && this.has('ult_lock')) return false;
    return this.abilities[i].cd === 0;
  }
  damageReduction(){
    let r = 0;
    for(const s of this.statuses) if(s.id==='damage_reduction'||s.id==='dr_unreducible') r += (s.mag||0)/100;
    return Math.min(0.85, r);
  }
  damageTakenUp(){
    let r = 0;
    for(const s of this.statuses) if(DMG_TAKEN_UP.includes(s.id)) r += (s.mag||0)/100;
    return r;
  }
  healMult(){
    if(this.has('healing_block')) return 0;
    const a = this.find('anti_heal');
    return a ? Math.max(0, 1 - (a.mag||0)/100) : 1;
  }
}

/* ---------------- build player combatant from roster.json ---------------- */
function buildPlayer(unit, level){
  const m = playerPower(level);
  const b = unit.baseStats;
  return new Combatant({
    name: unit.name, title: unit.title, side:'player',
    aff: unit.affinity, role: unit.role, rarity: unit.rarity, uidSrc: unit.id,
    base:{ atk:b.atk*m, def:b.def*m, spd:b.spd*lvlMult(level),
           pot:b.pot??0, res:b.res??0, critRate:b.critRate??0.05, critDmg:b.critDmg??0.5 },
    maxHp: b.hp*m,
    abilities: unit.abilities.map(a => ({...a, effects:(a.effects||[]).map(e=>({...e}))})),
    signature: unit.signature, passives: unit.passives,
  });
}

/* ---------------- build enemies ---------------- */
function enemyAbilities(role, boss, arche){
  const basic = {name:'Strike', kind:'skill', target:'one_enemy', mult:1.0, cooldown:0, effects:[]};
  if(!boss){
    const a = [basic];
    if(role==='mender') a.push({name:'Mend',kind:'skill',target:'one_ally',mult:0,cooldown:2,
      effects:[{id:'heal',mag:CFG.MENDER_HEAL_PCT}]});
    if(role==='hexer') a.push({name:'Hex',kind:'skill',target:'one_enemy',mult:0.9,cooldown:2,
      effects:[{id:'def_break',mag:25,dur:2},{id:'spd_down',mag:20,dur:2}]});
    if(role==='zealot') a.push({name:'Sweep',kind:'skill',target:'all_enemies',mult:0.85,cooldown:2,effects:[]});
    if(role==='warden') a.push({name:'Bulwark',kind:'skill',target:'self',mult:0,cooldown:3,
      effects:[{id:'def_up',mag:35,dur:3}]});
    return a;
  }
  const K = {
    sprint:[ {name:'Rising Fury',kind:'skill',target:'self',mult:1.2,cooldown:2,effects:[{id:'atk_up',mag:35,dur:99,stacks:true}]},
             {name:'Cleave',kind:'skill',target:'all_enemies',mult:1.4,cooldown:2,effects:[]} ],
    bulwark:[{name:'Molten Guard',kind:'skill',target:'self',mult:0,cooldown:4,effects:[{id:'def_up',mag:40,dur:3},{id:'shield',mag:20,dur:3}]},
             {name:'Ground Slam',kind:'skill',target:'all_enemies',mult:1.5,cooldown:3,effects:[{id:'spd_down',mag:15,dur:2}]}],
    plague:[ {name:'Rot Bloom',kind:'skill',target:'all_enemies',mult:1.2,cooldown:2,effects:[{id:'def_break',mag:25,dur:3},{id:'poison',mag:4,dur:3}]},
             {name:'Fester',kind:'ult',target:'all_enemies',mult:1.0,cooldown:5,effects:[{id:'debuff_bomb',mag:0,dur:5}]}],
    purist:[ {name:'Renewing Tide',kind:'skill',target:'self',mult:0,cooldown:3,effects:[{id:'regen',mag:6,dur:4}]},
             {name:'Wither',kind:'skill',target:'one_enemy',mult:1.3,cooldown:3,effects:[{id:'def_break',mag:30,dur:3},{id:'anti_heal',mag:50,dur:2}]}],
    siege:[  {name:'Sweep',kind:'skill',target:'all_enemies',mult:1.0,cooldown:0,effects:[]},
             {name:'Ashen Vigil',kind:'skill',target:'self',mult:0,cooldown:4,effects:[{id:'regen',mag:5,dur:4}]}],
  }[arche];
  return [basic, ...K];
}
function makeEnemy(role, D, aff, boss=false){
  const a = ENEMY_ANCHOR[role];
  const m = lvlMult(D) * gearMult(enemyGear(D));
  const arche = boss ? BOSS_ARCHETYPE[role] : null;
  const hpP = boss ? CFG.BOSS_HP_PREMIUM[arche] : 1;
  const adP = boss ? CFG.BOSS_AD_PREMIUM : 1;
  return new Combatant({
    name: boss ? `${a.label} Sub-Boss` : a.label,
    title: boss ? arche.toUpperCase() : '',
    side:'enemy', aff, role, rarity: boss?'legendary':'common', boss, arche,
    base:{ atk:a.atk*m*adP, def:a.def*m*adP, spd:a.spd*lvlMult(D),
           pot:0.05, res:0.05, critRate:0.05, critDmg:0.5 },
    maxHp: a.hp*m*hpP,
    abilities: enemyAbilities(role, boss, arche),
  });
}

/* ============================================================================
   COMBAT
   ========================================================================= */
const S = {          // global game state
  roster:[], effects:null, owned:[], team:[], level:40,
  run:null, fight:null, speed:CFG.DEFAULT_SPEED, screen:'summon',
};
let LOG = [];
function log(msg, cls){ LOG.push({msg, cls}); if(LOG.length>400) LOG.shift(); }

const alliesOf = c => (c.side==='player' ? S.fight.team : S.fight.foes).filter(x=>x.alive);
const foesOf   = c => (c.side==='player' ? S.fight.foes : S.fight.team).filter(x=>x.alive);

function debuffLands(src, tgt, eff){
  if(eff.unresistable) return true;
  const base = eff.chance ?? 1.0;
  let pot = src.pot + (hasAdvantage(src.aff, tgt.aff) ? CFG.AFFINITY_POT_BONUS : 0);
  return chance(Math.max(0.05, Math.min(1.0, base * (1 + pot - tgt.res))));
}

function dealDamage(src, tgt, raw, opts={}){
  if(!tgt.alive) return 0;
  if(tgt.has('freeze') && !opts.dot){ log(`${tgt.name} is frozen — direct damage negated.`,'dim'); return 0; }
  if(!opts.dot && !opts.fixed){
    if(tgt.has('dodge_up') && !src.has('cannot_miss_buff') && chance((tgt.find('dodge_up').mag||0)/100)){
      log(`${tgt.name} evades ${src.name}.`,'dim'); return 0;
    }
    const blind = src.find('accuracy_down');
    if(blind && !src.has('cannot_miss_buff') && chance((blind.mag||0)/100)){
      log(`${src.name} misses — blinded.`,'dim'); return 0;
    }
  }
  let dmg = raw;
  let crit = false;
  if(!opts.dot && !opts.fixed){
    let cr = src.critRate + (hasAdvantage(src.aff,tgt.aff) ? CFG.AFFINITY_CRIT_BONUS : 0);
    if(src.has('guaranteed_crit_buff')){ crit = true; src.remove('guaranteed_crit_buff'); }
    else crit = chance(cr);
    if(crit) dmg *= (1 + src.critDmg);
    let def = tgt.def;
    if(opts.ignoreDef) def *= (1 - opts.ignoreDef);
    dmg = mitigate(dmg, def);
  }
  dmg *= (1 + tgt.damageTakenUp());
  dmg *= (1 - tgt.damageReduction());
  dmg *= vary();
  const cap = tgt.find('damage_cap');
  if(cap) dmg = Math.min(dmg, tgt.maxHp*(cap.mag||20)/100);
  dmg = Math.max(1, Math.round(dmg));

  if(tgt.shield > 0){
    const absorbed = Math.min(tgt.shield, dmg);
    tgt.shield -= absorbed; dmg -= absorbed;
    if(tgt.shield<=0) tgt.remove('shield'), tgt.remove('shield_unbreakable');
    if(absorbed) log(`  shield absorbs ${absorbed}`,'dim');
  }
  if(dmg>0){
    tgt.hp -= dmg;
    if(tgt.has('sleep')) tgt.remove('sleep');                 // sleep breaks on damage
    log(`${src.name} → ${tgt.name}: ${dmg}${crit?' CRIT':''}${opts.dot?' ('+opts.dot+')':''}`,
        src.side==='player'?'good':'bad');
  }
  /* reflect / counter */
  if(!opts.dot && dmg>0){
    const r = tgt.find('reflect');
    if(r && src.alive){ const back=Math.round(dmg*(r.mag||20)/100);
      src.hp-=back; log(`  ${tgt.name} reflects ${back}`,'dim'); }
    if(tgt.has('counter') && src.alive && tgt.alive){
      tgt.remove('counter');
      const c = Math.round(mitigate(tgt.atk*0.8, src.def));
      src.hp -= c; log(`  ${tgt.name} counters for ${c}`,'dim');
    }
  }
  /* lifesteal + team_damage_heals */
  if(dmg>0 && !opts.dot){
    const ls = src.find('lifesteal_buff');
    if(ls) healUnit(src, Math.round(dmg*(ls.mag||20)/100), src);
    const tdh = src.find('team_damage_heals');
    if(tdh) alliesOf(src).forEach(a=>healUnit(a, Math.round(dmg*(tdh.mag||10)/100), src));
  }
  checkDeath(tgt);
  checkDeath(src);
  return dmg;
}

function checkDeath(c){
  if(c.hp > 0 || !c.alive) return;
  if(c.has('death_immunity') || alliesOf(c).some(a=>a.has('prevent_death_team'))){
    c.hp = 1; return;
  }
  c.hp = 0; c.alive = false;
  log(`${c.name} falls.`, c.side==='player'?'bad':'good');
}

function healUnit(tgt, amt, src){
  if(!tgt.alive) return 0;
  amt = Math.round(amt * tgt.healMult());
  if(amt<=0) return 0;
  const before = tgt.hp;
  tgt.hp = Math.min(tgt.maxHp, tgt.hp + amt);
  const done = tgt.hp - before;
  if(done>0) log(`${tgt.name} heals ${done}`,'good');
  return done;
}

/* ---------------- applying one effect object ---------------- */
function applyEffect(src, tgt, e){
  const id = e.id, mag = e.mag ?? 0, dur = e.dur ?? 2;
  if(!IMPLEMENTED.has(id)){ log(`  [${id} not modelled]`,'dim'); return; }
  const meta = EFFECT_META[id];
  if(meta && meta.category!=='instant' && !isBuff(id) && tgt.side!==src.side){
    if(!debuffLands(src, tgt, e)){ log(`  ${id} resisted by ${tgt.name}`,'dim'); return; }
  }
  switch(id){
    case 'heal':       healUnit(tgt, tgt.maxHp*mag/100, src); return;
    case 'heal_team':  alliesOf(src).forEach(a=>healUnit(a, a.maxHp*mag/100, src)); return;
    case 'revive': {
      const dead = (src.side==='player'?S.fight.team:S.fight.foes).find(u=>!u.alive);
      if(dead){ dead.alive=true; dead.hp=Math.round(dead.maxHp*(mag||30)/100); dead.statuses=[];
        log(`${dead.name} is revived!`,'good'); }
      return; }
    case 'shield': case 'shield_unbreakable':
      tgt.shield = Math.max(tgt.shield, Math.round(tgt.maxHp*mag/100));
      tgt.add(id, mag, dur); return;
    case 'cleanse': case 'cleanse_all': {
      const list = id==='cleanse_all' ? alliesOf(src) : [tgt];
      list.forEach(u=>{ const before=u.statuses.length;
        u.statuses = u.statuses.filter(s=>!isCleansable(s.id));
        if(u.statuses.length<before) log(`${u.name} cleansed`,'good'); });
      return; }
    case 'strip': case 'strip_multi': {
      const list = id==='strip_multi' ? foesOf(src) : [tgt];
      list.forEach(u=>{ const before=u.statuses.length;
        u.statuses = u.statuses.filter(s=>!(isBuff(s.id) && !u.has('buff_undispellable')));
        if(u.statuses.length<before) log(`${u.name} stripped`,'warn'); });
      return; }
    case 'dispel_self_debuffs':
      src.statuses = src.statuses.filter(s=>!isCleansable(s.id)); return;
    case 'momentum_push':
      if(!tgt.has('momentum_immunity')) tgt.momentum = Math.max(0, tgt.momentum - mag); return;
    case 'knockback_momentum':
      if(!tgt.has('momentum_immunity')) tgt.momentum = 0; return;
    case 'momentum_pull':
      tgt.momentum = Math.min(CFG.MOMENTUM_FULL, tgt.momentum + mag); return;
    case 'momentum_steal': {
      const victim = foesOf(src)[0];
      if(victim && !victim.has('momentum_immunity')) victim.momentum = Math.max(0, victim.momentum-mag);
      src.momentum = Math.min(CFG.MOMENTUM_FULL, src.momentum + mag); return; }
    case 'extra_action':   tgt.extraTurn = true; return;
    case 'cooldown_reduction':
      tgt.abilities.forEach(a=>a.cd = Math.max(0, a.cd - Math.max(1, Math.round(mag/20)))); return;
    case 'cooldown_refund':
      src.abilities.forEach(a=>a.cd = Math.max(0, a.cd - 2)); return;
    case 'execute':
      if(tgt.alive && tgt.hp <= tgt.maxHp*mag/100){
        log(`${tgt.name} is EXECUTED.`,'warn'); tgt.hp=0; checkDeath(tgt); }
      return;
    case 'detonate_dot': {
      const dots = tgt.statuses.filter(s=>DOTS.includes(s.id));
      if(!dots.length) return;
      let burst = 0;
      dots.forEach(d => burst += tgt.maxHp*(d.mag||4)/100*d.stacks*1.5);
      tgt.statuses = tgt.statuses.filter(s=>!DOTS.includes(s.id));
      log(`  DoTs detonate on ${tgt.name}!`,'warn');
      dealDamage(src, tgt, Math.round(burst), {fixed:true}); return; }
    case 'spread_dot': {
      const dots = tgt.statuses.filter(s=>DOTS.includes(s.id));
      foesOf(src).forEach(f => { if(f!==tgt) dots.forEach(d=>f.add(d.id,d.mag,d.dur)); });
      if(dots.length) log(`  DoTs spread!`,'warn'); return; }
    case 'hp_cost':
      src.hp = Math.max(1, src.hp - Math.round(src.maxHp*mag/100));
      log(`  ${src.name} pays ${mag}% HP`,'dim'); return;
    case 'debuff_bomb':
      tgt.add('debuff_bomb', mag, dur);
      log(`  bomb planted on ${tgt.name} (${dur})`,'warn'); return;
    default:
      tgt.add(id, mag, dur, e.stacks === true);
  }
}

/* ---------------- resolve an ability ---------------- */
function resolveAbility(actor, ab, chosenTarget){
  log(`${actor.name} uses ${ab.name}.`, actor.side==='player'?'':'warn');
  const enemySide = foesOf(actor), allySide = alliesOf(actor);
  let dmgTargets = [];
  if(ab.mult > 0){
    if(ab.target==='all_enemies') dmgTargets = enemySide.slice();
    else if(ab.target==='self') dmgTargets = [];
    else if(ab.target==='one_ally'||ab.target==='all_allies') dmgTargets = [];
    else dmgTargets = chosenTarget ? [chosenTarget] : (enemySide.length?[pickTarget(actor,enemySide)]:[]);
  }
  const hits = ab.hits || 1;
  for(const t of dmgTargets){
    for(let h=0; h<hits; h++){
      if(!t.alive) break;
      let raw = ab.mult * actor.atk;
      if(ab.bonus_vs){
        const c = ab.bonus_vs.condition;
        const meets = (c==='target_hp_below_50' && t.hp < t.maxHp*0.5)
                   || (c==='target_hp_above_50' && t.hp >= t.maxHp*0.5)
                   || (c==='target_debuffed' && t.statuses.some(s=>isCleansable(s.id)))
                   || (c==='target_buffed' && t.statuses.some(s=>isBuff(s.id)));
        if(meets) raw *= (1 + (ab.bonus_vs.amount||0));
      }
      dealDamage(actor, t, raw, {ignoreDef: ab.ignore_def});
    }
  }
  /* effects — ally_side riders resolve on allies even on an enemy-targeted attack */
  for(const e of (ab.effects||[])){
    const toAlly = e.applies_to === 'ally_side' || ['all_allies','one_ally','self'].includes(ab.target);
    let targets;
    if(e.applies_to === 'ally_side'){
      targets = (ab.target==='all_allies' || e.team) ? allySide
              : [allySide.slice().sort((a,b)=>a.hp/a.maxHp - b.hp/b.maxHp)[0] || actor];
    } else if(ab.target==='self')        targets = [actor];
    else if(ab.target==='all_allies')    targets = allySide;
    else if(ab.target==='one_ally')      targets = [chosenTarget || allySide.sort((a,b)=>a.hp/a.maxHp-b.hp/b.maxHp)[0]];
    else if(ab.target==='all_enemies')   targets = enemySide;
    else                                 targets = dmgTargets.length?dmgTargets:(chosenTarget?[chosenTarget]:[]);
    for(const t of targets) if(t) applyEffect(actor, t, e);
  }
  ab.cd = ab.cooldown || 0;
}

/* ---------------- targeting ---------------- */
function pickTarget(actor, foes){
  const live = foes.filter(f=>f.alive);
  if(!live.length) return null;
  const taunter = live.find(f=>f.has('taunt_self')) ||
                  (actor.has('taunt')||actor.has('provoke_all') ? live.find(f=>f.has('taunt_self')) : null);
  if(taunter) return taunter;
  const visible = live.filter(f=>!f.has('stealth'));
  const pool = visible.length ? visible : live;
  if(actor.side==='enemy'){                      // spread aggro (mirrors the sim)
    const weights = pool.map(c => {
      let w = (c.role==='tank' ? CFG.ENEMY_TANK_THREAT : 1.0);
      const th = c.find('threat_mod'); if(th) w *= 1 + (th.mag||0)/100;
      return w * (1 + 0.3*(1 - c.hp/c.maxHp));
    });
    let roll = RNG()*weights.reduce((a,b)=>a+b,0);
    for(let i=0;i<pool.length;i++){ roll -= weights[i]; if(roll<=0) return pool[i]; }
    return pool[pool.length-1];
  }
  return pool.reduce((a,b)=> a.hp<=b.hp ? a : b);
}

/* ---------------- enemy AI ---------------- */
function enemyChoose(actor){
  const ready = actor.abilities.map((a,i)=>({a,i})).filter(({i})=>actor.canUse(i));
  if(!ready.length) return null;
  if(actor.role==='mender'){
    const hurt = alliesOf(actor).filter(a=>a.hp < a.maxHp*CFG.MENDER_TRIGGER);
    const healAb = ready.find(({a}) => (a.effects||[]).some(e=>e.id==='heal'||e.id==='heal_team'));
    if(hurt.length && healAb) return healAb;
  }
  const sustain = ready.find(({a}) => a.target==='self' &&
    (a.effects||[]).some(e=>['regen','def_up','shield','atk_up'].includes(e.id)));
  if(sustain && (actor.boss || actor.hp < actor.maxHp*0.6)) return sustain;
  const dmg = ready.filter(({a})=>a.mult>0);
  if(!dmg.length) return ready[0];
  return dmg.reduce((x,y)=> (x.a.mult*(1+0.3*x.a.cooldown) >= y.a.mult*(1+0.3*y.a.cooldown)) ? x : y);
}

/* ---------------- end-of-turn ticks ---------------- */
function tickStatuses(c){
  if(!c.alive) return;
  for(const s of [...c.statuses]){
    if(DOTS.includes(s.id)){
      const amp = c.find('dot_amp');
      let d;
      if(s.id==='poison')      d = c.maxHp*(s.mag||4)/100*s.stacks;
      else if(s.id==='bleed')  d = (s.mag||4)*3*s.stacks;
      else if(s.id==='burn')   d = c.maxHp*(s.mag||4)/100*s.stacks*1.1;
      else                     d = c.maxHp*(s.mag||4)/100*s.stacks*(1 + 0.25*(3-(s.dur||1)));
      if(amp) d *= 1 + (amp.mag||0)/100;
      dealDamage({name:s.id,side:c.side==='player'?'enemy':'player',aff:'judgment',
                  critRate:0,critDmg:0,statuses:[],find:()=>null,has:()=>false,alive:true},
                 c, Math.round(d), {dot:s.id, fixed:true});
    }
    if(s.id==='regen')   healUnit(c, c.maxHp*(s.mag||5)/100, c);
    if(s.id==='wasting'){ c.hp -= Math.round(c.maxHp*(s.mag||5)/100); checkDeath(c); }
    if(s.id==='sleep')   healUnit(c, c.maxHp*0.20, c);
    if(s.id==='debuff_bomb'){
      s.dur--;
      if(s.dur<=0){
        log(`💥 Bomb detonates on ${c.name}!`,'warn');
        BOMB_PAYLOAD.forEach(p=>c.add(p.id,p.mag,p.dur));
        c.remove('debuff_bomb');
      }
      continue;
    }
    if(s.id==='permanent_buff_flag' || (s.dur??0) >= 99) continue;
    s.dur--;
    if(s.dur<=0) c.remove(s.id);
  }
  c.abilities.forEach(a=>{ if(a.cd>0) a.cd--; });
}

/* ============================================================================
   FIGHT LOOP — momentum driven
   ========================================================================= */
function startFight(team, foes, label){
  S.fight = {team, foes, label, round:0, over:false, awaiting:null, result:null};
  team.forEach(u=>{ u.momentum = RNG()*CFG.START_MOMENTUM_JITTER; u.statuses=[]; u.shield=0; });
  log(`— ${label} —`,'warn');
  render(); stepFight();
}

function advanceMomentum(){
  const live = [...S.fight.team, ...S.fight.foes].filter(c=>c.alive);
  let guard = 0;
  while(guard++ < 20000){
    const ready = live.filter(c=>c.momentum >= CFG.MOMENTUM_FULL);
    if(ready.length) return ready.reduce((a,b)=>a.momentum>=b.momentum?a:b);
    for(const c of live) c.momentum += c.spd * CFG.TICK_RATE;
  }
  return live[0];
}

function stepFight(){
  const F = S.fight;
  if(!F || F.over) return;
  if(!F.team.some(u=>u.alive)) return endFight('LOSS');
  if(!F.foes.some(u=>u.alive)) return endFight('WIN');
  if(F.round > CFG.MAX_ROUNDS) return endFight('TIMEOUT');

  const actor = advanceMomentum();
  if(!actor) return endFight('TIMEOUT');
  F.round++;
  F.active = actor;

  if(actor.skipsTurn){
    const which = CONTROL_SKIP.find(c=>actor.has(c));
    log(`${actor.name} loses the turn (${which}).`,'dim');
    if(which==='freeze') actor.remove('freeze');
    actor.momentum -= CFG.MOMENTUM_FULL;
    tickStatuses(actor);
    render();
    return schedule(stepFight);
  }

  if(actor.side==='enemy'){
    const choice = enemyChoose(actor);
    actor.momentum -= CFG.MOMENTUM_FULL;
    if(choice) resolveAbility(actor, choice.a, null);
    else log(`${actor.name} has nothing available.`,'dim');
    tickStatuses(actor);
    render();
    return schedule(stepFight);
  }
  /* player unit — wait for input */
  F.awaiting = {actor, ability:null};
  render();
}

function playerPick(idx){
  const F = S.fight, actor = F.awaiting.actor;
  const ab = actor.abilities[idx];
  if(!actor.canUse(idx)) return;
  const needsTarget = ab.target==='one_enemy' || (ab.target==='one_ally' && ab.mult===0);
  if(needsTarget){ F.awaiting.ability = ab; render(); }
  else commitPlayer(ab, null);
}
function commitPlayer(ab, target){
  const F = S.fight, actor = F.awaiting.actor;
  F.awaiting = null;
  actor.momentum -= CFG.MOMENTUM_FULL;
  resolveAbility(actor, ab, target);
  tickStatuses(actor);
  if(actor.extraTurn){ actor.extraTurn=false; actor.momentum = CFG.MOMENTUM_FULL; }
  render();
  schedule(stepFight);
}
function schedule(fn){ setTimeout(fn, CFG.BASE_STEP_MS / S.speed); }

function endFight(result){
  S.fight.over = true; S.fight.result = result;
  log(result==='WIN' ? '✔ Fight won.' : result==='LOSS' ? '✘ Team wiped.' : '⧗ Stalemate.',
      result==='WIN'?'good':'bad');
  render();
  setTimeout(()=>onFightEnd(result), 500/S.speed);
}

/* ============================================================================
   RUN MANAGER
   ========================================================================= */
function genComp(D){
  const n = D < 40 ? 2 + rint(3) : 3 + rint(2);
  const pool = ['bruiser','bruiser','warden','zealot','hexer','mender'];  // variety over guarantee
  return Array.from({length:n}, () => pick(pool));
}
function genRun(D, site){
  const fights = CFG.FIGHTS_MIN + rint(CFG.FIGHTS_MAX - CFG.FIGHTS_MIN + 1);
  return { D, site, fights, tint: pick(AFFINITIES),
           comps: Array.from({length:fights}, ()=>genComp(D)),
           bossRole: pick(Object.keys(ENEMY_ANCHOR)), idx:0 };
}
function spawn(roles, D, tint){
  return roles.map(r => makeEnemy(r, D, chance(CFG.TINT_CHANCE) ? tint : pick(AFFINITIES)));
}
function beginRun(d){
  S.run = genRun(d.D, d.site);
  S.run.bossRole = d.bossRole;
  S.team.forEach(u=>{ u.hp = u.maxHp; u.abilities.forEach(a=>a.cd=0); u.statuses=[]; u.alive=true; });
  LOG = [];
  nextFight();
}
function nextFight(){
  const R = S.run;
  if(R.idx < R.fights){
    R.idx++;
    S.screen='fight';
    startFight(S.team, spawn(R.comps[R.idx-1], R.D, R.tint), `Fight ${R.idx} / ${R.fights}`);
  } else {
    S.screen='fight';
    startFight(S.team, [makeEnemy(R.bossRole, R.D, R.tint, true)], `SUB-BOSS — ${BOSS_ARCHETYPE[R.bossRole]}`);
  }
}
function onFightEnd(result){
  const R = S.run;
  if(result!=='WIN'){ S.screen='result'; S.result={ok:false, reason: result==='LOSS'?'Your team was wiped.':'The fight stalled out.'}; return render(); }
  if(R.idx >= R.fights && S.fight.foes[0].boss){ S.screen='result'; S.result={ok:true}; return render(); }
  S.team.forEach(u=>{ if(u.alive) u.hp = Math.min(u.maxHp, u.hp + Math.round(u.maxHp*CFG.BETWEEN_FIGHT_REGEN)); });
  S.team.forEach(u=>u.statuses=[]);
  S.screen='between'; render();
}

/* ============================================================================
   SUMMON / TEAM
   ========================================================================= */
function doSummon(){
  const byR = {common:[],epic:[],legendary:[]};
  S.roster.forEach(u=>byR[u.rarity]?.push(u));
  S.owned = [];
  for(let i=0;i<CFG.SUMMON_PULLS;i++){
    const r = RNG();
    const rar = r < CFG.SUMMON_ODDS.legendary ? 'legendary'
              : r < CFG.SUMMON_ODDS.legendary + CFG.SUMMON_ODDS.epic ? 'epic' : 'common';
    S.owned.push(pick(byR[rar].length ? byR[rar] : S.roster));
  }
  S.team = [];
}

/* ============================================================================
   RENDER
   ========================================================================= */
const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[<>&]/g, c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
const hpColor = f => f>0.5 ? 'var(--green)' : f>0.25 ? 'var(--amber)' : 'var(--red)';

function verdictOf(ratio){
  if(ratio>1.15) return {label:'Faceroll',   c:'#5b6b7a', blurb:'Well below you. Fast clears, thin rewards.'};
  if(ratio>1.02) return {label:'Comfortable',c:'#3fa66a', blurb:'A clean run for a current team.'};
  if(ratio>0.92) return {label:'Fair Fight', c:'#d9a441', blurb:'Matched to you. A good team wins; a lazy one does not.'};
  if(ratio>0.82) return {label:'Stretch',    c:'#d9772f', blurb:'Above you. You will need real synergy.'};
  return               {label:'Brutal',      c:'#c8384a', blurb:'A gear check. Beating this is a flex.'};
}
function buildBoard(){
  const pPow = playerPower(S.level);
  return CFG.DUNGEON_OFFSETS.map((off,i)=>{
    const D = Math.max(1, Math.min(100, S.level + off));
    const dPow = lvlMult(D) * gearMult(enemyGear(D));
    const bossRole = pick(Object.keys(ENEMY_ANCHOR));
    return { D, tier: Math.ceil(D/10), ratio: pPow/dPow, v: verdictOf(pPow/dPow),
             fights: CFG.FIGHTS_MIN + rint(CFG.FIGHTS_MAX-CFG.FIGHTS_MIN+1),
             bossRole, arche: BOSS_ARCHETYPE[bossRole], tint: pick(AFFINITIES),
             site: SITES[(S.level+i) % SITES.length] };
  });
}
let BOARD = null;

function unitCard(u, sel, onclick){

    </div>
    <div style="font-size:16px;margin-top:4px">${esc(u.name)}</div>
    <div class="dim" style="font-size:11.5px;font-style:italic">${esc(u.title||'')}</div>
    <div class="mono dim" style="font-size:10px;margin-top:6px">
      ${esc((u.role||'').replace('_',' '))} · ${AFF_LABEL[u.affinity||u.aff]}</div>

}

function render(){
  const app = $('#app');
  if(S.screen==='summon')        app.innerHTML = viewSummon();
  else if(S.screen==='team')     app.innerHTML = viewTeam();
  else if(S.screen==='menu')     app.innerHTML = viewMenu();
  else if(S.screen==='dungeon')  app.innerHTML = viewDungeon();
  else if(S.screen==='fight')    app.innerHTML = viewFight();
  else if(S.screen==='between')  app.innerHTML = viewBetween();
  else if(S.screen==='result')   app.innerHTML = viewResult();

function viewSummon(){
  if(!S.owned.length) return `<div class="panel">
    <div class="eyebrow">SESSION START</div><h1>Summon</h1>
    <p class="sub">${CFG.SUMMON_PULLS} pulls, granted. Build a team from what you actually get.</p>
    <button class="primary" onclick="doSummon();render()">Summon ×${CFG.SUMMON_PULLS}</button></div>`;
  const counts = S.owned.reduce((m,u)=>(m[u.rarity]=(m[u.rarity]||0)+1,m),{});
  return `<div class="panel"><div class="eyebrow">SESSION START</div><h1>Your pulls</h1>
    <p class="sub mono" style="font-size:12px">
      ${counts.legendary||0} legendary · ${counts.epic||0} epic · ${counts.common||0} common</p>
    <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(160px,1fr))">
      ${S.owned.map(u=>unitCard(u,false,null)).join('')}</div>
    <div class="row" style="margin-top:16px">
      <button class="primary" onclick="S.screen='team';render()">Build a team →</button>
      <button onclick="doSummon();render()">Re-roll pulls</button></div></div>`;
}

function viewTeam(){
  const uniq = [...new Map(S.owned.map(u=>[u.id,u])).values()];
  return `<div class="panel"><div class="eyebrow">TEAM MANAGEMENT</div><h1>Choose ${CFG.TEAM_SIZE}</h1>
    <p class="sub">Selected ${S.team.length} / ${CFG.TEAM_SIZE}. Click to add or remove.</p>
    <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(160px,1fr))">
      ${uniq.map((u,i)=>unitCard(u, S.team.some(t=>t.uidSrc===u.id), `toggleTeam(${i})`)).join('')}</div>
    <div class="row" style="margin-top:16px">
      <button class="primary" ${S.team.length!==CFG.TEAM_SIZE?'disabled':''}
        onclick="S.screen='menu';render()">Confirm team →</button>
      <button onclick="S.team=[];render()">Clear</button></div></div>`;
}
function toggleTeam(i){
  const uniq = [...new Map(S.owned.map(u=>[u.id,u])).values()];
  const u = uniq[i];
  const at = S.team.findIndex(t=>t.uidSrc===u.id);
  if(at>=0) S.team.splice(at,1);
  else if(S.team.length < CFG.TEAM_SIZE) S.team.push(buildPlayer(u, S.level));
  render();
}

function viewMenu(){
  return `<div class="panel"><div class="eyebrow">HOME</div><h1>Main Menu</h1>
    <p class="sub">Roster level ${S.level} · effective power ${playerPower(S.level).toFixed(2)}×
      <span class="mono dim" style="font-size:11px">(gear mode: ${CFG.PLAYER_GEAR_MODE})</span></p>
    <div class="row" style="margin-bottom:14px">
      ${S.team.map(u=>`<div class="card" style="min-width:150px">
        <div style="font-size:15px">${esc(u.name)}</div>
        <div class="mono dim" style="font-size:10px">${esc(u.role.replace('_',' '))} · ${AFF_LABEL[u.aff]}</div>
      </div>`).join('')}</div>
    <label class="ctl" style="margin-bottom:14px">Player level
      <input type="range" min="1" max="100" value="${S.level}"
        oninput="setLevel(+this.value)"><span class="mono" style="color:var(--gold)">${S.level}</span></label>
    <div class="row">
      <button onclick="S.screen='team';render()">Team Management</button>
      <button class="primary" onclick="BOARD=buildBoard();S.screen='dungeon';render()">Dungeon →</button>
    </div></div>`;
}
function setLevel(v){
  S.level = v;
  const ids = S.team.map(t=>t.uidSrc);
  S.team = ids.map(id => buildPlayer(S.roster.find(u=>u.id===id), S.level));
  render();
}

function viewDungeon(){
  return `<div class="panel"><div class="eyebrow">EXPEDITION BOARD</div><h1>Choose your descent</h1>
    <p class="sub">Five sites surface each cycle — some beneath you, some past your reach.</p>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(196px,1fr))">
    ${BOARD.map((d,i)=>`<div class="card" style="cursor:pointer" onclick="beginRun(BOARD[${i}]);">
      <div class="mono" style="font-size:10px;letter-spacing:1.5px;color:${d.v.c}">TIER ${d.tier} · LV ${d.D}</div>
      <div style="font-size:16px;margin-top:4px">${d.site}</div>
      <div class="chip" style="background:#241b13;color:${d.v.c};margin-top:8px">${d.v.label}</div>
      <div class="dim" style="font-size:12px;font-style:italic;min-height:34px;margin-top:4px">${d.v.blurb}</div>
      <div class="bar" style="margin:8px 0"><div style="width:${Math.max(8,Math.min(100,(2-d.ratio)*90))}%;background:${d.v.c}"></div></div>
      <div class="mono dim" style="font-size:11px">${d.fights} fights · ${d.arche} boss</div>
      <div class="mono aff-${d.tint}" style="font-size:10px;margin-top:3px">${AFF_LABEL[d.tint]}-tinged</div>
    </div>`).join('')}</div>
    <div class="row" style="margin-top:16px"><button onclick="S.screen='menu';render()">← Back</button>
    <button onclick="BOARD=buildBoard();render()">Re-roll board</button></div></div>`;
}

function statusPills(c){
  return c.statuses.map(s=>{
    const cat = EFFECT_META[s.id]?.category;
    const cls = cat==='buff'?'buff' : cat==='control'?'ctrl' : 'debuff';
    return `<span class="st ${cls}">${s.id}${s.stacks>1?'×'+s.stacks:''}${s.dur<90?' '+s.dur:''}</span>`;
  }).join('');
}
function combatantBox(c, targetable, idx){
  const f = Math.max(0, c.hp/c.maxHp);
  const act = S.fight.active===c && !S.fight.over;
  return `<div class="combatant ${c.alive?'':'dead'} ${act?'active':''} ${targetable?'targetable':''}"
      ${targetable?`onclick="chooseTarget(${idx})"`:''}>
    <div class="row" style="justify-content:space-between">
      <span style="font-size:14px">${esc(c.name)}</span>
      <span class="mono aff-${c.aff}" style="font-size:9px">${c.boss?'BOSS':''}</span></div>
    <div class="mono dim" style="font-size:10px">${esc((c.role||'').replace('_',' '))}</div>
    <div class="bar" style="margin:5px 0 3px"><div style="width:${f*100}%;background:${hpColor(f)}"></div></div>
    <div class="mono dim" style="font-size:10px">${Math.max(0,Math.round(c.hp))} / ${c.maxHp}
      ${c.shield>0?`· <span style="color:var(--blue)">◈${Math.round(c.shield)}</span>`:''}</div>
    <div class="bar" style="height:3px;margin-top:4px"><div style="width:${Math.min(100,c.momentum)}%;background:var(--gold)"></div></div>
    <div style="margin-top:5px">${statusPills(c)}</div>
  </div>`;
}
function viewFight(){
  const F = S.fight;
  const aw = F.awaiting;
  const targeting = aw && aw.ability;
  return `<div class="panel">
    <div class="row" style="justify-content:space-between">
      <div><div class="eyebrow">${S.run ? `${S.run.site} · LV ${S.run.D}` : ''}</div>
        <h2>${esc(F.label)}</h2></div>
      <div class="row">${CFG.SPEEDS.map(s=>`<button onclick="S.speed=${s};render()"
        ${S.speed===s?'class="primary"':''}>${s}×</button>`).join('')}</div></div>
    <div class="eyebrow" style="margin-top:10px;color:var(--red)">ENEMIES${targeting?' — CLICK A TARGET':''}</div>
    <div class="row" style="margin:6px 0 14px">${F.foes.map((c,i)=>combatantBox(c, !!targeting && c.alive, i)).join('')}</div>
    <div class="eyebrow" style="color:var(--green)">YOUR TEAM</div>
    <div class="row" style="margin:6px 0 12px">${F.team.map(c=>combatantBox(c,false,-1)).join('')}</div>
    ${aw ? `<div class="panel" style="background:var(--panel2);margin-bottom:10px">
      <div class="mono" style="font-size:11px;color:var(--gold);margin-bottom:6px">
        ${esc(aw.actor.name)} acts${targeting?' — pick a target':''}</div>
      <div class="row" id="abilitybar">${aw.actor.abilities.map((a,i)=>{
        const ok = aw.actor.canUse(i);
        return `<button ${ok?'':'disabled'} onclick="playerPick(${i})"
          ${aw.ability===a?'class="primary"':''}>
          ${esc(a.name)} <span class="mono dim" style="font-size:10px">
          ${a.mult?('×'+a.mult):''}${a.cd?` cd${a.cd}`:''}</span></button>`;
      }).join('')}
      ${targeting?`<button onclick="S.fight.awaiting.ability=null;render()">cancel</button>`:''}</div></div>`:''}
    <div class="log" id="log">${LOG.slice(-80).map(l=>`<div class="${l.cls||''}">${esc(l.msg)}</div>`).join('')}</div>
  </div>`;
}
function chooseTarget(i){
  const F = S.fight;
  if(!F.awaiting || !F.awaiting.ability) return;
  const t = F.foes[i];
  if(!t || !t.alive) return;
  commitPlayer(F.awaiting.ability, t);
}

function viewBetween(){
  const R = S.run;
  const hp = S.team.reduce((a,u)=>a+Math.max(0,u.hp),0) / S.team.reduce((a,u)=>a+u.maxHp,0);
  return `<div class="panel"><div class="eyebrow">${R.site} · LV ${R.D}</div>
    <h1>Fight ${R.idx} cleared</h1>
    <p class="sub">${R.idx} of ${R.fights} normal fights done — then the sub-boss.
      Recovered ${Math.round(CFG.BETWEEN_FIGHT_REGEN*100)}% HP. Cooldowns carry.</p>
    <div class="bar" style="margin-bottom:6px"><div style="width:${hp*100}%;background:${hpColor(hp)}"></div></div>
    <div class="mono dim" style="font-size:11px;margin-bottom:14px">team ${Math.round(hp*100)}% ·
      ${S.team.filter(u=>u.alive).length}/${S.team.length} standing</div>
    <div class="row">${S.team.map(u=>{const f=Math.max(0,u.hp/u.maxHp);
      return `<div class="card" style="min-width:150px"><div>${esc(u.name)}</div>
      <div class="bar" style="margin-top:6px"><div style="width:${f*100}%;background:${hpColor(f)}"></div></div>
      <div class="mono dim" style="font-size:10px;margin-top:3px">${Math.max(0,Math.round(u.hp))}/${u.maxHp}</div>
      </div>`}).join('')}</div>
    <div class="row" style="margin-top:16px">
      <button class="primary" onclick="nextFight()">
        ${R.idx>=R.fights?'Face the sub-boss →':'Next fight →'}</button></div></div>`;
}

function viewResult(){
  const ok = S.result.ok;
  return `<div class="panel"><div class="eyebrow">RUN ${ok?'COMPLETE':'FAILED'}</div>
    <h1>${ok?'The descent holds.':'The run ends here.'}</h1>
    <p class="sub">${ok
      ? 'Sub-boss cleared — escrow would commit here. (Rewards are out of scope for this playtest.)'
      : esc(S.result.reason)+' Escrow wiped; brought-in levels persist.'}</p>
    <div class="row"><button class="primary" onclick="S.screen='menu';S.run=null;render()">← Main Menu</button></div>
  </div>`;
}

/* ============================================================================
   BOOT
   ========================================================================= */
function ingest(roster, effects){
  S.roster = roster.units;
  S.effects = effects;
  EFFECT_META = {};
  effects.effects.forEach(e => EFFECT_META[e.id] = {category:e.category, stacks:e.stacks, name:e.name});
  $('#boot').classList.add('hidden');
  $('#app').classList.remove('hidden');
  S.screen='summon'; render();
}
async function boot(){
  const msg = $('#bootmsg');
  try{
    const [r,e] = await Promise.all([
      fetch('../data/roster.json').then(x=>{if(!x.ok)throw 0;return x.json()}),
      fetch('../data/effects.json').then(x=>{if(!x.ok)throw 0;return x.json()}),
    ]);
    msg.textContent = `loaded ${r.units.length} units, ${e.effects.length} effects`;
    ingest(r,e);
  }catch(err){
    msg.innerHTML = `<span style="color:var(--accent)">Could not fetch the data spine.</span>`;
    $('#bootpick').classList.remove('hidden');
  }
}
$('#filepick').addEventListener('change', async ev=>{
  const files = [...ev.target.files];
  const read = f => new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(JSON.parse(fr.result));fr.readAsText(f)});
  const parsed = await Promise.all(files.map(read));
  const roster = parsed.find(p=>p.units), effects = parsed.find(p=>p.effects);
  if(roster && effects) ingest(roster, effects);
  else $('#bootmsg').innerHTML = '<span style="color:var(--red)">Need both roster.json and effects.json.</span>';
});
boot();
</script>

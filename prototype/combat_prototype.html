<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Combat Slice Prototype — Momentum</title>
<style>
  :root{
    --bg:#12141a; --panel:#1b1e27; --panel2:#20242f; --line:#2c3140;
    --text:#eef0f4; --dim:#9aa2b1; --good:#68d391; --bad:#fc8181; --warn:#f6ad55;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;overflow-x:hidden;}
  #app{max-width:1000px;margin:0 auto;padding:16px 16px 140px;position:relative;}
  h1{font-size:1.05rem;font-weight:600;color:var(--dim);letter-spacing:.04em;text-transform:uppercase;margin:0 0 12px;}
  h1 span{color:var(--text);}

  #track-wrap{position:relative;height:78px;background:var(--panel);border:1px solid var(--line);
    border-radius:10px;margin-bottom:14px;overflow:hidden;}
  #track-wrap::before{content:"NEXT";position:absolute;left:8px;top:6px;font-size:.6rem;color:var(--dim);letter-spacing:.1em;}
  .track-slot{position:absolute;top:22px;width:56px;height:48px;border-radius:8px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-size:.62rem;font-weight:700;color:#0a0b0e;transition:left .28s cubic-bezier(.2,.8,.2,1),opacity .2s;
    box-shadow:0 2px 6px rgba(0,0,0,.4);}
  .track-slot.now{transform:scale(1.12);box-shadow:0 0 0 2px #fff,0 2px 10px rgba(0,0,0,.5);}
  .track-slot .n{opacity:.7;font-size:.55rem;}
  .track-pulse{animation:pulseSlot .5s ease-out;}
  @keyframes pulseSlot{0%{box-shadow:0 0 0 0 rgba(255,255,255,.9);}100%{box-shadow:0 0 0 12px rgba(255,255,255,0);}}

  .row{display:flex;gap:10px;margin-bottom:10px;justify-content:center;flex-wrap:wrap;}
  .unit{position:relative;width:150px;min-height:118px;border-radius:10px;padding:8px;
    background:var(--panel);border:2px solid var(--line);transition:box-shadow .15s, transform .1s;}
  .unit.dead{opacity:.35;filter:grayscale(1);}
  .unit.active-turn{box-shadow:0 0 0 3px #fff, 0 0 22px rgba(255,255,255,.35);}
  .unit.targetable{cursor:pointer;box-shadow:0 0 0 3px var(--warn);}
  .unit.targetable:hover{box-shadow:0 0 0 3px #fff;}
  .unit .swatch{width:100%;height:34px;border-radius:6px;margin-bottom:6px;position:relative;overflow:hidden;}
  .unit .name{font-size:.72rem;font-weight:700;}
  .unit .aff{font-size:.58rem;color:var(--dim);margin-bottom:4px;}
  .bar{height:8px;border-radius:4px;background:#0d0f14;overflow:hidden;margin-bottom:3px;border:1px solid #000;}
  .bar > i{display:block;height:100%;transition:width .18s linear;}
  .hp > i{background:linear-gradient(90deg,#68d391,#38b06a);}
  .hp.low > i{background:linear-gradient(90deg,#fc8181,#c53030);}
  .mom > i{background:linear-gradient(90deg,#63b3ed,#3182ce);transition:width .12s linear;}
  .shield-tick{position:absolute;right:0;top:0;height:100%;background:rgba(120,200,255,.55);}
  .hpnum{font-size:.56rem;color:var(--dim);display:flex;justify-content:space-between;margin-bottom:4px;}
  .badges{display:flex;gap:3px;flex-wrap:wrap;min-height:16px;}
  .badge{font-size:.52rem;padding:1px 4px;border-radius:8px;background:#0d0f14;border:1px solid var(--line);color:var(--dim);white-space:nowrap;}
  .badge.buff{color:var(--good);border-color:#255c3d;}
  .badge.debuff{color:var(--bad);border-color:#5c2525;}
  .ultpip{position:absolute;top:6px;right:6px;width:18px;height:18px;border-radius:50%;
    background:#0d0f14;border:1px solid var(--line);font-size:.55rem;display:flex;align-items:center;justify-content:center;color:var(--dim);}
  .ultpip.ready{background:var(--warn);color:#221200;border-color:var(--warn);box-shadow:0 0 8px var(--warn);}

  .flash{animation:flashWhite .16s ease-out;}
  @keyframes flashWhite{0%{filter:brightness(2.6) saturate(0.3);}100%{filter:brightness(1);}}
  .critflash{animation:flashCrit .28s ease-out;}
  @keyframes flashCrit{0%{filter:brightness(3) hue-rotate(20deg);}100%{filter:brightness(1);}}
  .shakeS{animation:shakeS .22s;}
  @keyframes shakeS{10%{transform:translate(-2px,1px)}30%{transform:translate(2px,-1px)}50%{transform:translate(-2px,-1px)}70%{transform:translate(2px,1px)}90%{transform:translate(-1px,0)}100%{transform:translate(0,0)}}
  .shakeBig{animation:shakeBig .38s;}
  @keyframes shakeBig{10%{transform:translate(-6px,3px)}25%{transform:translate(6px,-4px)}40%{transform:translate(-7px,-2px)}55%{transform:translate(7px,3px)}70%{transform:translate(-4px,-2px)}85%{transform:translate(3px,1px)}100%{transform:translate(0,0)}}
  #battlefield.shakeField{animation:shakeS .22s;}
  #battlefield.shakeFieldBig{animation:shakeBig .4s;}

  .dmg-pop{position:absolute;left:50%;top:20px;transform:translateX(-50%);font-weight:800;
    font-size:1.05rem;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.6);pointer-events:none;
    animation:popUp .85s ease-out forwards;z-index:5;}
  @keyframes popUp{0%{transform:translate(-50%,4px) scale(.5);opacity:0;}18%{transform:translate(-50%,-6px) scale(1.25);opacity:1;}100%{transform:translate(-50%,-52px) scale(1);opacity:0;}}
  .dmg-pop.crit{color:#ffd54f;font-size:1.5rem;}
  .dmg-pop.heal{color:#68d391;}
  .dmg-pop.miss{color:#9aa2b1;font-size:.85rem;}

  #vignette{position:fixed;inset:0;pointer-events:none;opacity:0;z-index:20;
    background:radial-gradient(circle at 50% 45%,rgba(255,255,255,0) 40%,rgba(255,220,120,.35) 100%);}
  #vignette.on{animation:vig .55s ease-out;}
  @keyframes vig{0%{opacity:0;}25%{opacity:1;}100%{opacity:0;}}

  #hud-bottom{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(180deg,rgba(18,20,26,0),var(--bg) 30%);
    padding:10px 16px 16px;display:flex;justify-content:center;}
  #actions{width:100%;max-width:1000px;background:var(--panel2);border:1px solid var(--line);
    border-radius:12px;padding:10px 14px;display:flex;align-items:center;gap:10px;min-height:64px;flex-wrap:wrap;}
  #actorTag{font-size:.7rem;color:var(--dim);min-width:120px;}
  #actorTag b{color:var(--text);}
  .skillbtn{background:#2a2f3d;border:1px solid var(--line);color:var(--text);padding:9px 14px;
    border-radius:8px;font-size:.72rem;font-weight:600;cursor:pointer;position:relative;}
  .skillbtn:hover:not(:disabled){background:#343a4b;}
  .skillbtn:disabled{opacity:.4;cursor:not-allowed;}
  .skillbtn.ult{border-color:var(--warn);color:var(--warn);}
  .skillbtn.ult:not(:disabled){box-shadow:0 0 10px rgba(246,173,85,.35);}
  .skillbtn .cd{position:absolute;top:-7px;right:-7px;background:#0d0f14;border:1px solid var(--line);
    border-radius:50%;width:18px;height:18px;font-size:.55rem;display:flex;align-items:center;justify-content:center;color:var(--dim);}
  .skillbtn.armed{outline:2px solid #fff;}
  #hint{font-size:.68rem;color:var(--warn);margin-left:auto;}

  #log{position:fixed;top:16px;right:16px;width:230px;max-height:220px;overflow-y:auto;
    background:rgba(20,22,29,.85);border:1px solid var(--line);border-radius:8px;padding:8px 10px;
    font-size:.66rem;color:var(--dim);z-index:15;}
  #log div{margin-bottom:3px;line-height:1.3;}
  #log .l-crit{color:var(--warn);}
  #log .l-heal{color:var(--good);}
  #log .l-debuff{color:var(--bad);}
  #log .l-ult{color:#e9d8fd;font-weight:700;}

  #overlay{position:fixed;inset:0;background:rgba(8,9,12,.88);display:flex;align-items:center;
    justify-content:center;flex-direction:column;z-index:30;text-align:center;}
  #overlay.hidden{display:none;}
  #overlay h2{font-size:1.8rem;margin:0 0 6px;}
  #overlay p{color:var(--dim);max-width:420px;margin:0 0 18px;font-size:.85rem;line-height:1.5;}
  #overlay button{background:var(--warn);border:none;color:#221200;font-weight:700;padding:12px 26px;
    border-radius:8px;font-size:.9rem;cursor:pointer;}
  #overlay button:hover{filter:brightness(1.1);}
  .glow-win{text-shadow:0 0 24px #f6ad55,0 0 60px rgba(246,173,85,.6);animation:glowPulse 1.6s ease-in-out infinite alternate;}
  @keyframes glowPulse{from{text-shadow:0 0 12px #f6ad55;}to{text-shadow:0 0 36px #f6ad55,0 0 70px rgba(246,173,85,.7);}}

  #tuning{position:fixed;top:16px;left:16px;font-size:.6rem;color:var(--dim);opacity:.55;max-width:200px;z-index:15;}
  #tuning:hover{opacity:1;}
</style>
</head>
<body>
<div id="vignette"></div>
<div id="log"></div>
<div id="tuning">Step 1-4 combat slice · placeholder art · tune constants at top of &lt;script&gt;</div>

<div id="app">
  <h1>Combat Slice — <span>Momentum Prototype</span></h1>
  <div id="track-wrap"></div>
  <div id="battlefield">
    <div class="row" id="enemyRow"></div>
    <div class="row" id="playerRow"></div>
  </div>
</div>

<div id="hud-bottom">
  <div id="actions">
    <div id="actorTag">Waiting…</div>
    <div id="hint"></div>
  </div>
</div>

<div id="overlay">
  <h2 id="ovTitle">Combat Slice</h2>
  <p id="ovText">4 virtue-embodiments vs. a 3-unit enemy team. Momentum drives turn order — push, pull, and punish.</p>
  <button id="ovBtn">Start Battle</button>
</div>

<script>
"use strict";

/* ---------------- TUNING (first guesses — tune by feel) ---------------- */
const TUNING = {
  TICK_MS: 90,          // real ms per momentum "tick"
  TICK_RATE: 0.07,
  DEF_SOFTCAP: 1000,
  PULL_AMOUNT: 25,
  PUSH_AMOUNT: 30,
  HITPAUSE_MS: 90,
  HITPAUSE_CRIT_MS: 190,
  HITPAUSE_ULT_MS: 260,
  SHAKE_ULT_SLOWMO: 0.35,
  SHAKE_ULT_SLOWMO_MS: 550,
};

/* ---------------- ROSTER ---------------- */
const PLAYER_DEFS = [
  {id:'dil',name:'Diligence',affinity:'Revelation',maxHP:1050,ATK:215,DEF:150,SPD:118,CRIT_RATE:.15,CRIT_DMG:.5,POT:.15,RES:.15,color:'#4f8cff'},
  {id:'pat',name:'Patience', affinity:'Mystery',   maxHP:1150,ATK:195,DEF:175,SPD:100,CRIT_RATE:.12,CRIT_DMG:.5,POT:.10,RES:.20,color:'#38b2ac'},
  {id:'cha',name:'Charity',  affinity:'Life',      maxHP:1300,ATK:160,DEF:210,SPD:104,CRIT_RATE:.10,CRIT_DMG:.5,POT:.10,RES:.25,color:'#ecc94b'},
  {id:'jus',name:'Justice',  affinity:'Judgment',  maxHP:950, ATK:240,DEF:140,SPD:122,CRIT_RATE:.20,CRIT_DMG:.55,POT:.20,RES:.15,color:'#9f7aea'},
];
const ENEMY_DEFS = [
  {id:'mar',name:'Marauder', affinity:'Majesty',   maxHP:900, ATK:190,DEF:130,SPD:112,CRIT_RATE:.10,CRIT_DMG:.5,POT:.10,RES:.10,color:'#e53e3e'},
  {id:'wra',name:'Wraith',   affinity:'Life',      maxHP:850, ATK:175,DEF:140,SPD:96, CRIT_RATE:.10,CRIT_DMG:.5,POT:.15,RES:.10,color:'#c53030'},
  {id:'col',name:'Colossus', affinity:'Revelation',maxHP:1400,ATK:150,DEF:260,SPD:78, CRIT_RATE:.05,CRIT_DMG:.5,POT:.05,RES:.20,color:'#822727'},
];

const AFF_CYCLE = {Judgment:'Life', Life:'Revelation', Revelation:'Judgment'};

/* ---------------- STATE ---------------- */
let units = [];
let logEl = document.getElementById('log');
let audioCtx = null;
let gameOver = false;
let slowMoUntil = 0;
let awaitingTarget = null; // {skillKey, validTeam, resolve}

function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

function freshUnit(def, team){
  return {
    ...def, team, hp:def.maxHP, momentum: Math.random()*20, alive:true,
    shield:0, buffs:[], debuffs:[],
    cd:{active:0, ult:0},
    stacks:0, // persistence / forbearance
    el:null,
  };
}

function resetBattle(){
  units = [
    ...PLAYER_DEFS.map(d=>freshUnit(d,'player')),
    ...ENEMY_DEFS.map(d=>freshUnit(d,'enemy')),
  ];
  gameOver = false;
  logEl.innerHTML = '';
  buildUnitDOM();
  logMsg('The fight begins.', '');
}

/* ---------------- DOM BUILD ---------------- */
function buildUnitDOM(){
  const pRow = document.getElementById('playerRow');
  const eRow = document.getElementById('enemyRow');
  pRow.innerHTML=''; eRow.innerHTML='';
  for(const u of units){
    const box = document.createElement('div');
    box.className='unit';
    box.dataset.id=u.id;
    box.innerHTML = `
      <div class="ultpip" data-role="ultpip">${u.cd.ult||''}</div>
      <div class="swatch" style="background:${u.color}"><div class="shield-tick" data-role="shieldtick" style="width:0%"></div></div>
      <div class="name">${u.name}</div>
      <div class="aff">${u.affinity}</div>
      <div class="hpnum"><span data-role="hpnum">${u.hp}/${u.maxHP}</span></div>
      <div class="bar hp"><i data-role="hpbar" style="width:100%"></i></div>
      <div class="bar mom"><i data-role="mombar" style="width:0%"></i></div>
      <div class="badges" data-role="badges"></div>
    `;
    box.addEventListener('click', ()=> onUnitClick(u));
    u.el = box;
    (u.team==='player'?pRow:eRow).appendChild(box);
  }
  buildTrackSlots();
}

let trackSlots=[];
function buildTrackSlots(){
  const wrap = document.getElementById('track-wrap');
  wrap.querySelectorAll('.track-slot').forEach(n=>n.remove());
  trackSlots=[];
  for(let i=0;i<6;i++){
    const s=document.createElement('div');
    s.className='track-slot';
    s.style.left = (12+i*64)+'px';
    wrap.appendChild(s);
    trackSlots.push(s);
  }
}

/* ---------------- RENDER ---------------- */
function render(){
  for(const u of units){
    if(!u.el) continue;
    u.el.classList.toggle('dead', !u.alive);
    const hpbar = u.el.querySelector('[data-role=hpbar]');
    const hpnum = u.el.querySelector('[data-role=hpnum]');
    const mombar = u.el.querySelector('[data-role=mombar]');
    const shieldtick = u.el.querySelector('[data-role=shieldtick]');
    const ultpip = u.el.querySelector('[data-role=ultpip]');
    const badges = u.el.querySelector('[data-role=badges]');
    const pct = Math.max(0,u.hp/u.maxHP*100);
    hpbar.style.width = pct+'%';
    hpbar.parentElement.classList.toggle('low', pct<30);
    hpnum.textContent = `${Math.max(0,Math.round(u.hp))}/${u.maxHP}`;
    mombar.style.width = Math.min(100,u.momentum)+'%';
    shieldtick.style.width = u.shield>0 ? Math.min(100, u.shield/u.maxHP*100)+'%' : '0%';
    ultpip.textContent = u.cd.ult>0 ? u.cd.ult : '✓';
    ultpip.classList.toggle('ready', u.cd.ult===0 && u.alive);
    badges.innerHTML='';
    for(const b of [...u.buffs, ...u.debuffs]){
      const el=document.createElement('span');
      el.className='badge '+(u.buffs.includes(b)?'buff':'debuff');
      el.textContent = `${b.label}${b.duration!=null?' '+b.duration:''}`;
      badges.appendChild(el);
    }
  }
  renderTrack();
}

function projectTurnOrder(count=6){
  const sim = units.filter(u=>u.alive).map(u=>({id:u.id,name:u.name,team:u.team,color:u.color,momentum:u.momentum,spd:u.SPD}));
  const order=[]; let guard=0;
  while(order.length<count && guard<400 && sim.length){
    guard++;
    let best=null,bestT=Infinity;
    for(const s of sim){
      if(s.spd<=0) continue;
      const needed = Math.max(0,100-s.momentum);
      const t = needed/(s.spd*TUNING.TICK_RATE);
      if(t<bestT){bestT=t;best=s;}
    }
    if(!best) break;
    for(const s of sim) s.momentum += s.spd*TUNING.TICK_RATE*bestT;
    order.push({id:best.id,name:best.name,team:best.team,color:best.color});
    best.momentum -= 100;
  }
  return order;
}

let lastTrackIds = [];
function renderTrack(){
  const order = projectTurnOrder(6);
  order.forEach((o,i)=>{
    const slot = trackSlots[i];
    if(!slot) return;
    const short = o.name.slice(0,3).toUpperCase();
    if(slot.dataset.uid !== o.id+i || slot.dataset.stamp !== short){
      slot.dataset.uid = o.id+i;
      slot.dataset.stamp = short;
      slot.style.background = o.color;
      slot.innerHTML = `<div>${short}</div><div class="n">${i===0?'NOW':'+'+i}</div>`;
    }
    slot.classList.toggle('now', i===0);
  });
  for(let i=order.length;i<trackSlots.length;i++){
    trackSlots[i].innerHTML='';
    trackSlots[i].style.background='transparent';
    trackSlots[i].dataset.uid='';
  }
  const ids = order.map(o=>o.id).join(',');
  if(ids !== lastTrackIds){
    lastTrackIds = ids;
  }
}

function pulseTrack(){
  document.getElementById('track-wrap').classList.remove('track-pulse');
  void document.getElementById('track-wrap').offsetWidth;
  document.getElementById('track-wrap').classList.add('track-pulse');
}

/* ---------------- LOG ---------------- */
function logMsg(text, cls){
  const d=document.createElement('div');
  if(cls) d.className='l-'+cls;
  d.textContent = text;
  logEl.appendChild(d);
  logEl.scrollTop = logEl.scrollHeight;
  while(logEl.children.length>40) logEl.removeChild(logEl.firstChild);
}

/* ---------------- AUDIO ---------------- */
function ac(){
  if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  return audioCtx;
}
function tone(freq,dur,type='square',gain=.05,delay=0){
  try{
    const ctx=ac();
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type=type; o.frequency.value=freq;
    g.gain.value=gain;
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+delay+dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(ctx.currentTime+delay);
    o.stop(ctx.currentTime+delay+dur+0.02);
  }catch(e){}
}
const sfx = {
  hit:()=>tone(160,.09,'square',.07),
  crit:()=>{tone(220,.12,'square',.09); tone(440,.12,'square',.05,.02);},
  whiff:()=>tone(90,.12,'sawtooth',.03),
  heal:()=>{tone(520,.14,'sine',.05); tone(660,.16,'sine',.04,.05);},
  ui:()=>tone(700,.04,'square',.03),
  ult:()=>{tone(80,.3,'sawtooth',.06); tone(160,.3,'square',.05,.05); tone(320,.35,'square',.04,.12);},
  resist:()=>tone(300,.08,'triangle',.04),
  win:()=>{[523,659,784,1047].forEach((f,i)=>tone(f,.5,'sine',.06,i*.12));},
  lose:()=>{[300,260,220,180].forEach((f,i)=>tone(f,.4,'sawtooth',.05,i*.15));},
};

/* ---------------- JUICE HELPERS ---------------- */
function spawnPop(unit, text, cls){
  const pop=document.createElement('div');
  pop.className='dmg-pop'+(cls?' '+cls:'');
  pop.textContent=text;
  unit.el.style.position='relative';
  unit.el.appendChild(pop);
  setTimeout(()=>pop.remove(),900);
}
function flashUnit(unit, big){
  unit.el.classList.remove('flash','critflash');
  void unit.el.offsetWidth;
  unit.el.classList.add(big?'critflash':'flash');
}
function shakeField(big){
  const bf=document.getElementById('battlefield');
  bf.classList.remove('shakeField','shakeFieldBig');
  void bf.offsetWidth;
  bf.classList.add(big?'shakeFieldBig':'shakeField');
}
function vignette(){
  const v=document.getElementById('vignette');
  v.classList.remove('on'); void v.offsetWidth; v.classList.add('on');
}

/* ---------------- COMBAT MATH ---------------- */
function effectiveATK(u){
  let mult=1;
  for(const b of u.buffs) if(b.type==='atkUp') mult+=b.pct;
  for(const d of u.debuffs) if(d.type==='atkDown') mult-=d.pct;
  if(u.id==='dil') mult += 0.05*u.stacks;      // Persistence
  if(u.id==='pat') mult += 0.06*u.stacks;      // Forbearance
  return u.ATK*Math.max(0,mult);
}
function effectiveDEF(u){
  let mult=1;
  for(const b of u.buffs) if(b.type==='defUp') mult+=b.pct;
  for(const b of u.debuffs) if(b.type==='defBreak') mult-=b.pct;
  if(u.id==='pat') mult += 0.04*u.stacks;
  return Math.max(0,u.DEF*mult);
}
function effectivePOT(u, bonus=0){
  let v=u.POT+bonus;
  for(const b of u.buffs) if(b.type==='potUp') v+=b.pct;
  return v;
}
function affinityResult(atkAff, defAff){
  if(AFF_CYCLE[atkAff]===defAff) return 'adv';
  if(AFF_CYCLE[defAff]===atkAff) return 'dis';
  if((atkAff==='Majesty'&&defAff==='Mystery')||(atkAff==='Mystery'&&defAff==='Majesty')) return 'adv';
  return 'neutral';
}

async function dealDamage(attacker, defender, mult, opts={}){
  const {ignoreDef=false, isUlt=false} = opts;
  const aff = affinityResult(attacker.affinity, defender.affinity);
  const critBonus = aff==='adv'?0.15:(aff==='dis'?-0.15:0);
  const potBonus   = aff==='adv'?0.15:(aff==='dis'?-0.15:0);

  const raw = mult * effectiveATK(attacker);
  let mitigated = ignoreDef ? raw : raw * (TUNING.DEF_SOFTCAP/(TUNING.DEF_SOFTCAP+effectiveDEF(defender)));

  const critRate = Math.max(0, attacker.CRIT_RATE+critBonus);
  const isCrit = Math.random() < critRate;
  if(isCrit) mitigated *= (1+attacker.CRIT_DMG);

  if(attacker.id==='jus' && defender.debuffs.length>0) mitigated *= 1.5; // The Guilty Fall

  mitigated *= (0.95 + Math.random()*0.10);

  // Bear the Burden redirect
  let target = defender;
  const charity = units.find(u=>u.id==='cha');
  if(charity && charity.alive && charity!==defender && defender.team==='player'){
    const redirect = charity.buffs.find(b=>b.type==='redirect');
    if(redirect){
      const redirected = mitigated*redirect.pct;
      mitigated -= redirected;
      await applyHit(charity, redirected, false);
    }
  }

  await applyHit(target, mitigated, isCrit, isUlt);
  return {final:mitigated, isCrit};
}

async function applyHit(unit, amount, isCrit, isUlt){
  let remaining = amount;
  if(unit.shield>0){
    const absorbed = Math.min(unit.shield, remaining);
    unit.shield -= absorbed;
    remaining -= absorbed;
  }
  unit.hp = Math.max(0, unit.hp - remaining);
  render();
  flashUnit(unit, isCrit);
  shakeField(isUlt || isCrit);
  spawnPop(unit, Math.round(amount).toString(), isCrit?'crit':'');
  if(isCrit) sfx.crit(); else sfx.hit();
  if(isUlt){ vignette(); slowMoUntil = performance.now()+TUNING.HITPAUSE_ULT_MS+TUNING.SHAKE_ULT_SLOWMO_MS; }
  await sleep(isUlt?TUNING.HITPAUSE_ULT_MS:(isCrit?TUNING.HITPAUSE_CRIT_MS:TUNING.HITPAUSE_MS));
  if(unit.hp<=0 && unit.alive){
    unit.alive=false;
    logMsg(`${unit.name} falls.`, 'debuff');
    render();
  }
}

function heal(target, amount, sourceIsCharityGrace){
  if(!target || !target.alive) return 0;
  const actual = Math.min(amount, target.maxHP-target.hp);
  target.hp += actual;
  spawnPop(target, '+'+Math.round(actual), 'heal');
  sfx.heal();
  render();
  const charity = units.find(u=>u.id==='cha');
  if(target===charity && !sourceIsCharityGrace && charity && charity.alive){
    const lowest = lowestHPAlly(charity.team, [charity]);
    if(lowest) heal(lowest, actual*0.10, true);
  }
  return actual;
}

function applyDebuffChance(baseChance, attacker, defender, affBonus=0){
  const chance = Math.max(0.05, Math.min(1, baseChance*(1+effectivePOT(attacker,affBonus)-defender.RES)));
  return Math.random()<chance;
}

function addBuff(u, buff){ u.buffs = u.buffs.filter(b=>b.type!==buff.type); u.buffs.push(buff); }
function addDebuff(u, debuff){ u.debuffs = u.debuffs.filter(d=>d.type!==debuff.type); u.debuffs.push(debuff); }

function lowestHPAlly(team, exclude=[]){
  return units.filter(u=>u.alive && u.team===team && !exclude.includes(u))
    .sort((a,b)=>a.hp/a.maxHP - b.hp/b.maxHP)[0] || units.filter(u=>u.alive && u.team===team)[0];
}
function lowestDEF(team){
  return units.filter(u=>u.alive && u.team===team).sort((a,b)=>effectiveDEF(a)-effectiveDEF(b))[0];
}
function lowestHPEnemy(team){
  return units.filter(u=>u.alive && u.team===team).sort((a,b)=>a.hp-b.hp)[0];
}
function highestMomentum(team){
  return units.filter(u=>u.alive && u.team===team).sort((a,b)=>b.momentum-a.momentum)[0];
}

/* ---------------- SKILL DEFINITIONS (players) ---------------- */
const SKILLS = {
  dil:{
    s1:{name:'Steady Strike', target:'enemy', cd:0, exec: async(a,t)=>{
      await dealDamage(a,t,1.0);
      a.momentum = Math.min(100, a.momentum+6);
      logMsg(`${a.name} uses Steady Strike on ${t.name}.`,'');
    }},
    active:{name:'Quicken', target:'ally', cdMax:3, exec: async(a,t)=>{
      t.momentum = Math.min(100, t.momentum+TUNING.PULL_AMOUNT);
      pulseTrack();
      logMsg(`${a.name} pulls ${t.name}'s Momentum (+${TUNING.PULL_AMOUNT}).`,'');
    }},
    ult:{name:'Industry', target:'none', cdMax:4, exec: async(a)=>{
      sfx.ult();
      for(const ally of units.filter(u=>u.alive && u.team===a.team)){
        ally.momentum = Math.min(100, ally.momentum+20);
        addBuff(ally, {type:'potUp', label:'Potency+', pct:0.15, duration:2});
      }
      pulseTrack();
      logMsg(`${a.name} unleashes Industry — team tempo surges!`,'ult');
    }},
  },
  pat:{
    s1:{name:'Forbearance', target:'enemy', cd:0, exec: async(a,t)=>{
      await dealDamage(a,t,0.8);
      logMsg(`${a.name} uses Forbearance on ${t.name}.`,'');
    }},
    active:{name:'Long Game', target:'enemy', cdMax:4, exec: async(a,t)=>{
      const mult = 1.0+0.4*a.stacks;
      logMsg(`${a.name} unleashes Long Game (${a.stacks} stacks)!`,'');
      a.stacks=0;
      await dealDamage(a,t,mult);
    }},
    ult:{name:'The Meek Inherit', target:'none', cdMax:5, exec: async(a)=>{
      sfx.ult();
      const mult = 2.0+0.3*a.stacks;
      logMsg(`${a.name} calls down The Meek Inherit!`,'ult');
      for(const e of units.filter(u=>u.alive && u.team!==a.team)){
        await dealDamage(a,e,mult,{isUlt:true});
      }
    }},
  },
  cha:{
    s1:{name:'Offering', target:'enemy', cd:0, exec: async(a,t)=>{
      const {final} = await dealDamage(a,t,0.7);
      const ally = lowestHPAlly(a.team);
      heal(ally, final*0.5);
      logMsg(`${a.name} offers pain as grace — heals ${ally.name}.`,'heal');
    }},
    active:{name:'Bear the Burden', target:'none', cdMax:4, exec: async(a)=>{
      addBuff(a, {type:'redirect', label:'Redirect', pct:0.5, duration:2});
      logMsg(`${a.name} bears the team's burden.`,'');
      render();
    }},
    ult:{name:'Selfless Vigil', target:'none', cdMax:4, exec: async(a)=>{
      sfx.ult();
      const shieldAmt = a.maxHP*0.3;
      for(const ally of units.filter(u=>u.alive && u.team===a.team)){
        ally.shield += shieldAmt;
        for(const b of a.buffs) if(ally!==a) addBuff(ally, {...b});
      }
      logMsg(`${a.name} pours out Selfless Vigil — the team is shielded.`,'ult');
      render();
    }},
  },
  jus:{
    s1:{name:'Verdict', target:'enemy', cd:0, exec: async(a,t)=>{
      await dealDamage(a,t,1.1);
      logMsg(`${a.name} passes Verdict on ${t.name}.`,'');
    }},
    active:{name:'Weigh the Scales', target:'enemy', cdMax:3, exec: async(a,t)=>{
      const landed = applyDebuffChance(1.0, a, t);
      if(landed){
        addDebuff(t, {type:'defBreak', label:'Def Break', pct:0.4, duration:2});
        logMsg(`${a.name} breaks ${t.name}'s defense.`,'debuff');
      } else {
        sfx.resist();
        logMsg(`${t.name} resists Weigh the Scales.`,'debuff');
      }
      render();
    }},
    ult:{name:'Final Judgment', target:'enemy', cdMax:4, exec: async(a,t)=>{
      sfx.ult();
      const ignoreDef = t.debuffs.length>0;
      logMsg(`${a.name} passes Final Judgment on ${t.name}${ignoreDef?' — defenses mean nothing!':''}`,'ult');
      await dealDamage(a,t,4.0,{ignoreDef, isUlt:true});
    }},
  },
};

/* ---------------- ENEMY AI ---------------- */
const ENEMY_KIT = {
  mar:{ specialName:'Sunder Tempo', specialCdMax:2 },
  wra:{ specialName:'Weaken', specialCdMax:3 },
  col:{ specialName:'Smite', specialCdMax:4 },
};

async function enemyAct(actor){
  const players = ()=>units.filter(u=>u.alive && u.team==='player');
  if(players().length===0) return;

  if(actor.id==='mar' && actor.cd.active===0){
    const t = highestMomentum('player');
    actor.cd.active = ENEMY_KIT.mar.specialCdMax;
    t.momentum = Math.max(0, t.momentum-TUNING.PUSH_AMOUNT);
    pulseTrack();
    flashUnit(t,false);
    logMsg(`${actor.name} uses Sunder Tempo — ${t.name}'s Momentum is pushed back!`,'debuff');
    render();
    await sleep(400);
    return;
  }
  if(actor.id==='wra' && actor.cd.active===0){
    const t = lowestDEF('player');
    actor.cd.active = ENEMY_KIT.wra.specialCdMax;
    const landed = applyDebuffChance(0.9, actor, t);
    if(landed){
      addDebuff(t, {type:'atkDown', label:'Weakened', pct:0.3, duration:2});
      logMsg(`${actor.name} weakens ${t.name}.`,'debuff');
    } else {
      sfx.resist();
      logMsg(`${t.name} resists Weaken.`,'debuff');
    }
    render();
    await sleep(400);
    return;
  }
  if(actor.id==='col' && actor.cd.active===0){
    const t = lowestHPEnemy('player');
    actor.cd.active = ENEMY_KIT.col.specialCdMax;
    logMsg(`${actor.name} winds up Smite on ${t.name}!`,'');
    await dealDamage(actor, t, 1.6);
    return;
  }
  const t = lowestHPEnemy('player');
  await dealDamage(actor, t, 0.9);
  logMsg(`${actor.name} attacks ${t.name}.`,'');
}

/* ---------------- TURN LOOP ---------------- */
function startOfTurnUpkeep(actor){
  if(actor.cd.active>0) actor.cd.active--;
  if(actor.cd.ult>0) actor.cd.ult--;
  for(const b of actor.buffs) if(b.duration!=null) b.duration--;
  for(const d of actor.debuffs) if(d.duration!=null) d.duration--;
  actor.buffs = actor.buffs.filter(b=>b.duration==null || b.duration>0);
  actor.debuffs = actor.debuffs.filter(d=>d.duration==null || d.duration>0);
  if(actor.id==='dil') actor.stacks++;
  if(actor.id==='pat') actor.stacks++;
}

function checkWinLoss(){
  const playersAlive = units.some(u=>u.team==='player' && u.alive);
  const enemiesAlive = units.some(u=>u.team==='enemy' && u.alive);
  if(!playersAlive) return 'lose';
  if(!enemiesAlive) return 'win';
  return null;
}

function tickUntilReady(){
  return new Promise(resolve=>{
    let last=performance.now();
    function frame(ts){
      if(gameOver) return;
      const dt = ts-last; last=ts;
      const slowMo = performance.now()<slowMoUntil ? TUNING.SHAKE_ULT_SLOWMO : 1;
      const ticks = (dt/TUNING.TICK_MS)*slowMo;
      let ready=null, readyMomentum=-1;
      for(const u of units){
        if(!u.alive) continue;
        u.momentum += u.SPD*TUNING.TICK_RATE*ticks;
        if(u.momentum>=100 && u.momentum>readyMomentum){ ready=u; readyMomentum=u.momentum; }
      }
      render();
      if(ready){ resolve(ready); return; }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  });
}

function onUnitClick(u){
  if(!awaitingTarget) return;
  const {validTeam, resolve} = awaitingTarget;
  if(!u.alive || u.team!==validTeam) return;
  clearTargeting();
  resolve(u);
}
function clearTargeting(){
  document.querySelectorAll('.unit.targetable').forEach(el=>el.classList.remove('targetable'));
  awaitingTarget = null;
}
function armTargeting(team){
  return new Promise(resolve=>{
    document.querySelectorAll('.unit').forEach(el=>{
      const u = units.find(x=>x.id===el.dataset.id);
      if(u && u.alive && u.team===team) el.classList.add('targetable');
    });
    awaitingTarget = {validTeam:team, resolve};
  });
}

async function playerTurn(actor){
  actor.el.classList.add('active-turn');
  const kit = SKILLS[actor.id];
  const actionsEl = document.getElementById('actorTag');
  const actionsWrap = document.getElementById('actions');
  actionsEl.innerHTML = `<b>${actor.name}</b>'s turn`;

  const btnRow = document.createElement('div');
  btnRow.style.display='flex'; btnRow.style.gap='8px'; btnRow.style.flexWrap='wrap';

  function makeBtn(key, def){
    const b=document.createElement('button');
    b.className='skillbtn'+(key==='ult'?' ult':'');
    const cdVal = key==='ult'?actor.cd.ult:(key==='active'?actor.cd.active:0);
    b.disabled = cdVal>0;
    b.innerHTML = def.name + (cdVal>0?`<span class="cd">${cdVal}</span>`:'');
    b.onclick = async ()=>{
      sfx.ui();
      Array.from(btnRow.children).forEach(x=>x.disabled=true);
      let target=null;
      if(def.target==='enemy' || def.target==='ally'){
        const team = def.target==='enemy' ? (actor.team==='player'?'enemy':'player') : actor.team;
        document.getElementById('hint').textContent = `Choose a target for ${def.name}…`;
        b.classList.add('armed');
        target = await armTargeting(team);
        document.getElementById('hint').textContent='';
        b.classList.remove('armed');
      }
      if(key==='active') actor.cd.active = def.cdMax;
      if(key==='ult') actor.cd.ult = def.cdMax;
      await def.exec(actor, target);
      render();
      finishSelection(true);
    };
    return b;
  }

  let finishSelection;
  const donePromise = new Promise(resolve=>{ finishSelection = resolve; });

  btnRow.appendChild(makeBtn('s1', kit.s1));
  btnRow.appendChild(makeBtn('active', kit.active));
  btnRow.appendChild(makeBtn('ult', kit.ult));
  actionsWrap.innerHTML='';
  actionsWrap.appendChild(actionsEl);
  actionsWrap.appendChild(btnRow);
  const hint=document.createElement('div'); hint.id='hint'; actionsWrap.appendChild(hint);

  await donePromise;
  actor.el.classList.remove('active-turn');
  actionsWrap.innerHTML = `<div id="actorTag">Resolving…</div><div id="hint"></div>`;
}

async function enemyTurn(actor){
  actor.el.classList.add('active-turn');
  document.getElementById('actorTag').innerHTML = `<b>${actor.name}</b> acts…`;
  await sleep(350);
  await enemyAct(actor);
  actor.el.classList.remove('active-turn');
}

async function runBattle(){
  while(!gameOver){
    const actor = await tickUntilReady();
    if(gameOver) return;
    actor.momentum -= 100;
    startOfTurnUpkeep(actor);
    render();

    if(actor.team==='player') await playerTurn(actor);
    else await enemyTurn(actor);

    render();
    const result = checkWinLoss();
    if(result){ endBattle(result); return; }
  }
}

function endBattle(result){
  gameOver = true;
  const overlay = document.getElementById('overlay');
  overlay.classList.remove('hidden');
  const title = document.getElementById('ovTitle');
  const text = document.getElementById('ovText');
  const btn = document.getElementById('ovBtn');
  if(result==='win'){
    title.textContent = 'Gloria';
    title.className='glow-win';
    text.textContent = 'The enemy team has fallen. The party stands unison, light-bloomed, in victory.';
    sfx.win();
  } else {
    title.textContent = 'Defeated';
    title.className='';
    text.textContent = 'The party has fallen. The fight is lost.';
    sfx.lose();
  }
  btn.textContent = 'Restart';
  logMsg(result==='win' ? 'Victory — Gloria.' : 'Defeat.', result==='win'?'ult':'debuff');
}

document.getElementById('ovBtn').addEventListener('click', ()=>{
  ac(); // unlock audio on user gesture
  document.getElementById('overlay').classList.add('hidden');
  resetBattle();
  runBattle();
});
</script>
